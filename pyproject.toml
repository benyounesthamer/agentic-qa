[project]
name = "agentic-qa"
version = "0.1.0"
description = "An LLM agent that writes, runs and repairs Playwright tests from a user story"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pytest>=8",
  "pytest-playwright>=0.5",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
